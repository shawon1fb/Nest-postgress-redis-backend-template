services:
  redis:
    image: redis:6.2.6
    container_name: backend-template-redis
    ports:
      - '6381:6379'
    command: redis-server --requirepass eChTelptB2spNWp92Pv_U2FJd8tT9jQg
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=eChTelptB2spNWp92Pv_U2FJd8tT9jQg
    expose:
      - 6379
    networks:
      - backend_network
  redis-bullmq:
    image: redis:6.2.6
    container_name: backend-template-redis-bullmq
    ports:
      - '6382:6379'
    command: redis-server
    environment:
      - REDIS_REPLICATION_MODE=master
      - REDIS_HOST=redis-bullmq
      - REDIS_PORT=6379
    expose:
      - 6379
    networks:
      - backend_network
  redis-bullboard:
    image: deadly0/bull-board
    container_name: backend-template-redis-bullboard
    ports:
      - '3001:3000'
    environment:
      - REDIS_HOST=redis-bullmq
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_USE_TLS=false
    depends_on:
      - redis-bullmq
    networks:
      - backend_network
  postgres:
    image: postgres:15-alpine
    container_name: backend-template-postgres
    ports:
      - '5433:5432'
    environment:
      - POSTGRES_DB=${DB_NAME:-task_db}
      - POSTGRES_USER=${DB_USER:-task_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-task_password_2024}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-task_user} -d ${DB_NAME:-task_db}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # S3-compatible object storage for the `s3` storage driver.
  # Console UI: http://localhost:9001
  minio:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: backend-template-minio
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    networks:
      - backend_network
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: creates the bucket so the app has somewhere to write on first run.
  minio-init:
    image: minio/minio:RELEASE.2025-03-12T18-04-18Z
    container_name: backend-template-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${STORAGE_S3_ACCESS_KEY_ID:-minioadmin}' '${STORAGE_S3_SECRET_ACCESS_KEY:-minioadmin}' &&
      mc mb --ignore-existing local/'${STORAGE_S3_BUCKET:-uploads}' &&
      echo 'bucket ${STORAGE_S3_BUCKET:-uploads} ready'
      "
    networks:
      - backend_network
    restart: 'no'

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local

networks:
  backend_network:
    driver: bridge
